<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 2FA 验证码生成器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-top: 0; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
        }
        input:focus { border-color: #007bff; }
        .code-display {
            font-size: 48px;
            font-weight: bold;
            color: #1a1a1a;
            margin: 25px 0;
            letter-spacing: 8px;
            font-family: monospace;
        }
        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-bar {
            height: 100%;
            background-color: #007bff;
            width: 100%;
            transition: width 1s linear, background-color 0.3s;
        }
        .status-text { font-size: 13px; color: #888; }
    </style>
</head>
<body>

    <div class="card">
        <h2>2FA 身份验证器</h2>
        <p>将会员的 OTP电子验证码 粘贴在下方获取 6 位动态密码</p>
        
        <input type="text" id="secretKey" placeholder="例如: JBSWY3DPEHPK3PXP" autocomplete="off">
        
        <div class="code-display" id="codeDisplay">------</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">等待输入密钥...</div>
    </div>

    <script>
        function updateCode() {
            // 获取输入内容并自动去除多余空格
            const secretInput = document.getElementById('secretKey').value.replace(/\s+/g, '').toUpperCase();
            const codeDisplay = document.getElementById('codeDisplay');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');

            if (!secretInput) {
                codeDisplay.innerText = "------";
                codeDisplay.style.fontSize = "48px";
                progressBar.style.width = "100%";
                progressBar.style.backgroundColor = "#007bff";
                statusText.innerText = "等待输入密钥...";
                return;
            }

            try {
                // 配置并生成 TOTP
                let totp = new OTPAuth.TOTP({
                    algorithm: "SHA1",
                    digits: 6,
                    period: 30,
                    secret: OTPAuth.Secret.fromBase32(secretInput)
                });

                let token = totp.generate();
                // 在 6 位数字中间加个空格，方便阅读 (例如：123 456)
                codeDisplay.innerText = token.slice(0, 3) + " " + token.slice(3);
                codeDisplay.style.fontSize = "48px";

                // 计算 30 秒倒计时的剩余时间
                let epoch = Math.floor(Date.now() / 1000);
                let remaining = 30 - (epoch % 30);
                
                // 更新进度条 UI
                let percentage = (remaining / 30) * 100;
                progressBar.style.width = percentage + "%";
                
                // 剩余时间小于 5 秒时变红提示
                if (remaining <= 5) {
                    progressBar.style.backgroundColor = "#dc3545"; 
                } else {
                    progressBar.style.backgroundColor = "#007bff"; 
                }

                statusText.innerText = `验证码将在 ${remaining} 秒后刷新`;

            } catch (e) {
                // 如果用户输入的不是合法的 Base32 密钥，给予提示
                codeDisplay.innerText = "无效的密钥格式";
                codeDisplay.style.fontSize = "24px";
                progressBar.style.width = "0%";
                statusText.innerText = "请检查是否复制完整";
            }
        }

        // 监听输入框变化，实时更新
        document.getElementById('secretKey').addEventListener('input', updateCode);
        // 每秒钟执行一次倒计时和更新
        setInterval(updateCode, 1000);
    </script>

</body>
</html>
