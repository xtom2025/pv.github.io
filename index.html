<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 2FA 验证码生成器 + 联系客服</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column; /* 改为纵向排列 */
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* 使用 min-height 以适应内容增长 */
            margin: 0;
            padding: 20px; /* 增加一些边距 */
            box-sizing: border-box;
        }
        
        /* 通用卡片样式 */
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
            overflow: hidden; /* 确保内容不超过圆角 */
        }

        /* 1. 验证器主体部分 */
        .authenticator-section {
            padding: 40px 30px 20px 30px; /* 底部预留空间给进度条 */
        }
        h2 { color: #333; margin-top: 0; margin-bottom: 10px;}
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
        }
        input:focus { border-color: #007bff; }
        
        /* 优化后的数字显示区域样式 (支持点击交互) */
        .code-display {
            font-size: 48px;
            font-weight: bold;
            color: #1a1a1a;
            margin: 25px 0;
            letter-spacing: 8px;
            font-family: monospace;
            cursor: pointer; /* 鼠标悬停变成小手 */
            transition: color 0.2s, transform 0.1s;
            user-select: none; /* 防止双击时出现蓝色文本选中背景 */
            padding: 10px;
            border-radius: 8px;
        }
        .code-display:hover {
            color: #007bff;
            background-color: #f8f9fa;
        }
        .code-display:active {
            transform: scale(0.98); /* 点击时轻微缩放反馈 */
        }
        .code-display.success-state {
            color: #28a745;
            font-size: 24px;
            letter-spacing: 2px;
            background-color: transparent;
        }
        .code-display.error-state {
            color: #dc3545;
            font-size: 24px;
            letter-spacing: 2px;
        }

        .progress-container {
            width: 100%;
            background-color: #e9ecef;
            height: 6px;
            overflow: hidden;
            margin-top: -6px; /* 进度条紧贴上方内容 */
        }
        .progress-bar {
            height: 100%;
            background-color: #007bff;
            width: 100%;
            transition: width 1s linear, background-color 0.3s;
        }
        .status-text { font-size: 13px; color: #888; padding: 10px 0; }

        /* 2. 新增：联系客服部分 */
        .contact-section {
            background-color: #f8f9fa; /* 淡灰色背景区分 */
            padding: 30px;
            border-top: 1px solid #eee;
        }
        .contact-section h3 {
            color: #444;
            margin-top: 0;
            font-size: 18px;
        }
        .contact-section p {
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .qr-code-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto; /* 居中 */
            border: 1px solid #ddd;
            padding: 5px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .qr-code-container img {
            max-width: 100%;
            max-height: 100%;
        }
        .contact-button {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .contact-button:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>

    <div class="card">
        <div class="authenticator-section">
            <h2>2FA 身份验证器</h2>
            <p class="subtitle">将会员的 OTP电子验证码 粘贴在下方获取 6 位动态密码，点击数字可以自动复制</p>
            
            <input type="text" id="secretKey" placeholder="例如: JBSWY3DPEHPK3PXP" autocomplete="off">
            
            <div class="code-display" id="codeDisplay" title="点击复制纯数字">------</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">等待输入密钥...</div>

        <div class="contact-section">
            <h3>联系客服</h3>
            <p>如果您在使用中遇到问题，请扫描下方二维码联系我们。</p>
            
            <div class="qr-code-container">
                <img src="contact_qr.png" alt="联系客服二维码">
            </div>
            
            <a href="https://amzpv.shop" class="contact-button" target="_blank">访问 AMZPV.SHOP</a>
        </div>
    </div>

    <script>
        let currentValidToken = ""; // 全局保存当前有效的数字验证码
        let isShowingFeedback = false; // 防止显示提示文字时被自动刷新覆盖

        function updateCode() {
            if (isShowingFeedback) return; // 如果正在显示“复制成功”，暂时停止 UI 更新

            const secretInput = document.getElementById('secretKey').value.replace(/\s+/g, '').toUpperCase();
            const codeDisplay = document.getElementById('codeDisplay');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');

            if (!secretInput) {
                currentValidToken = "";
                codeDisplay.innerText = "------";
                codeDisplay.style.fontSize = "48px";
                codeDisplay.className = "code-display"; 
                progressBar.style.width = "100%";
                progressBar.style.backgroundColor = "#007bff";
                statusText.innerText = "等待输入密钥...";
                return;
            }

            try {
                let totp = new OTPAuth.TOTP({
                    algorithm: "SHA1",
                    digits: 6,
                    period: 30,
                    secret: OTPAuth.Secret.fromBase32(secretInput)
                });

                let token = totp.generate();
                currentValidToken = token; // 将原始 6 位数字存起来，用于复制

                // 界面上显示时加一个空格，提升可读性
                codeDisplay.innerText = token.slice(0, 3) + " " + token.slice(3);
                codeDisplay.style.fontSize = "48px";
                codeDisplay.className = "code-display"; 

                let epoch = Math.floor(Date.now() / 1000);
                let remaining = 30 - (epoch % 30);
                
                let percentage = (remaining / 30) * 100;
                progressBar.style.width = percentage + "%";
                
                if (remaining <= 5) {
                    progressBar.style.backgroundColor = "#dc3545"; 
                } else {
                    progressBar.style.backgroundColor = "#007bff"; 
                }

                statusText.innerText = `验证码将在 ${remaining} 秒后刷新`;

            } catch (e) {
                currentValidToken = ""; 
                codeDisplay.innerText = "无效的密钥格式";
                codeDisplay.style.fontSize = "24px";
                codeDisplay.className = "code-display";
                progressBar.style.width = "0%";
                statusText.innerText = "请检查是否复制完整";
            }
        }

        // --- 核心更新：一键复制功能监听 ---
        document.getElementById('codeDisplay').addEventListener('click', function() {
            if (!currentValidToken) return; // 如果没有有效的验证码（例如刚打开或者报错时），点击无效

            const codeDisplay = this;
            
            // 使用现代剪贴板 API 写入原始数字
            navigator.clipboard.writeText(currentValidToken).then(() => {
                isShowingFeedback = true; // 开启提示锁定
                
                codeDisplay.innerText = "✅ 复制成功";
                codeDisplay.className = "code-display success-state";
                
                // 1.5 秒后恢复数字显示
                setTimeout(() => {
                    isShowingFeedback = false;
                    updateCode(); 
                }, 1500);

            }).catch(err => {
                isShowingFeedback = true;
                console.error('Failed to copy: ', err);
                
                codeDisplay.innerText = "❌ 复制失败";
                codeDisplay.className = "code-display error-state";
                
                setTimeout(() => {
                    isShowingFeedback = false;
                    updateCode();
                }, 1500);
            });
        });

        // 监听输入框变化，实时更新
        document.getElementById('secretKey').addEventListener('input', updateCode);
        // 每秒钟执行一次倒计时和更新
        setInterval(updateCode, 1000);
    </script>

</body>
</html>
